name: Pipeline CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Verificar aplicação
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Verificar arquivos HTML
        run: |
          echo "Listando arquivos HTML encontrados:"
          find . -name "*.html"

          if test -f "./public/index.html"; then
            echo "Arquivo index.html encontrado!"
          else
            echo "Arquivo index.html não encontrado!"
            exit 1
          fi

      - name: Concluir pipeline
        run: echo "Pipeline executado com sucesso!"
