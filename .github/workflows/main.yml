name: Pipeline CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Verificar aplicação
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Verificar arquivos HTML
        run: |
          echo "Arquivo index.html encontrado!"
          test -f "público/index.html"
          echo "Arquivo index.html encontrado!"

      - name: Concluir pipeline
        run: echo "Pipeline executado com sucesso!"
